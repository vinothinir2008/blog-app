<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
  <div class="card" id="post"></div>
  <h3>Comments</h3>
  <div id="comments"></div>
  <div class="card" id="addBox" style="display:none">
    <textarea id="text" placeholder="Write a comment..."></textarea>
    <button onclick="addComment()">Post Comment</button>
  </div>
  <p id="loginMsg" style="display:none"><a href="login.html">Login</a> to comment.</p>
</div>
<script src="common.js"></script>
<script>
navbar();
const id = new URLSearchParams(location.search).get('id');

async function loadPost() {
  try {
    const p = await api('/posts/' + id);
    const mine = token() && (p.author === myId() || role() === 'admin');
    document.getElementById('post').innerHTML = `
      <h2>${esc(p.title)}</h2>
      <small>By ${esc(p.authorName)} | ${new Date(p.createdAt).toLocaleString()}</small>
      <p style="white-space:pre-wrap">${esc(p.content)}</p>
      ${mine ? `<a href="write.html?id=${p._id}"><button style="width:100px">Edit</button></a>
                <button class="red" style="width:100px" onclick="delPost()">Delete</button>` : ''}`;
  } catch (e) { document.getElementById('post').innerText = e.message; }
}

async function loadComments() {
  const list = await api('/comments/post/' + id);
  document.getElementById('comments').innerHTML = list.map(c => {
    const can = token() && (c.author === myId() || role() === 'admin');
    return `<div class="card" style="margin-bottom:10px">
      <b>${esc(c.authorName)}</b> <small>${new Date(c.createdAt).toLocaleString()}</small>
      <p>${esc(c.text)}</p>
      ${can ? `<button class="red" style="width:80px" onclick="delComment('${c._id}')">Delete</button>` : ''}
    </div>`;
  }).join('') || '<p>No comments yet.</p>';
}

async function addComment() {
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  try {
    await api('/comments/post/' + id, 'POST', { text });
    document.getElementById('text').value = '';
    loadComments();
  } catch (e) { alert(e.message); }
}
async function delComment(cid) {
  if (!confirm('Delete comment?')) return;
  await api('/comments/' + cid, 'DELETE');
  loadComments();
}
async function delPost() {
  if (!confirm('Delete this post?')) return;
  await api('/posts/' + id, 'DELETE');
  location.href = 'index.html';
}

if (token()) document.getElementById('addBox').style.display = 'block';
else document.getElementById('loginMsg').style.display = 'block';
loadPost();
loadComments();
</script>
</body>
</html>
